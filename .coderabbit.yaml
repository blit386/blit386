# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for the blit386 monorepo (engine, demos, docs site, kit, scaffolder).
#
# Review exclusions (path_filters): generated or duplicated trees that add noise
# without unique review signal.
#
# - `packages/blit386/docs/_api-history.json` is generated by
#   `packages/blit386/scripts/gen-api-history.mjs` and is never hand-edited; diffs
#   are mechanical version/symbol maps.
# - `packages/blit386/tests/visual/__snapshots__/**` are binary PNG visual-
#   regression baselines; content is not useful for text review.
# - `.agents/skills/**` and `packages/*/.agents/skills/**` are relative symlinks
#   into the matching `.claude/skills/**`; reviewing both duplicates identical
#   content.
# - `pnpm-lock.yaml` is the single generated workspace lock file (listed
#   explicitly even though it may already match CodeRabbit defaults).
# - `packages/docs-site/content/docs/{api,guides,performance,reference}/**` and
#   `packages/docs-site/src/data/api-history.generated.json` are the
#   Documentation mirror from `packages/blit386/docs/`
#   (`pnpm run sync:docs` in `packages/docs-site`). Never hand-edit; fix the
#   engine package and re-sync. Reviewing them here only duplicates engine-side
#   review.
# - Binary assets carry no text diff worth reviewing, and several are large
#   enough to burn review budget for zero signal: `packages/docs-site/public/media/**`
#   is self-hosted blog video (~24 MB of `.av1.mp4`/`.h264.mp4`/`.webp`, produced by
#   `pnpm run encode:video`); fonts, sprites, audio clips, favicons, and the engine's
#   own bundled logo/system-font PNGs are likewise opaque binaries.
#
# Banner blocks inside published engine docs (`<!-- blit386.dev-banner:start -->`
# … `<!-- blit386.dev-banner:end -->`, owned by
# `packages/blit386/scripts/sync-doc-banners.mjs`) are in-file regions, not whole
# files — excluded via path_instructions below, not path_filters.
#
# Auto review is disabled by default. To enable it, add the `cr` label to the PR.
reviews:
  review_status: false
  path_filters:
    - '!packages/blit386/docs/_api-history.json'
    - '!packages/blit386/tests/visual/__snapshots__/**'
    - '!.agents/skills/**'
    - '!packages/*/.agents/skills/**'
    - '!pnpm-lock.yaml'
    - '!packages/docs-site/content/docs/api/**'
    - '!packages/docs-site/content/docs/guides/**'
    - '!packages/docs-site/content/docs/performance/**'
    - '!packages/docs-site/content/docs/reference/**'
    - '!packages/docs-site/src/data/api-history.generated.json'
    - '!packages/docs-site/public/media/**'
    - '!packages/docs-site/public/fonts/**'
    - '!packages/docs-site/public/logo/**'
    - '!packages/demos/public/fonts/**'
    - '!packages/demos/public/sprites/**'
    - '!packages/demos/public/audio/**'
    - '!packages/blit386/assets/**'
  path_instructions:
    - path: 'packages/blit386/src/**/*.ts'
      instructions: >-
        Follow BLIT386 TypeScript house rules: no `any` (use `unknown` or proper types); type-only imports (`import
        type`); integer coordinates via `Vector2i`/`Rect2i` (never raw floats for rendering); named exports only; use
        the `BT` namespace and never access `BTAPI` from demo/game code; prefer BT getters for zero-arg read-only
        snapshots and methods for mutations / parameterized queries; keep private/protected/module-local names free of
        enclosing class/file repetition (internal scoped naming). Canonical detail: `packages/blit386/CLAUDE.md`
        Critical Rules, and
        `packages/blit386/.claude/rules/{bt-api-getters,internal-scoped-naming,ts-file-structure}.md`.
    - path: 'packages/blit386/docs/**/*.md'
      instructions: >-
        Follow docs house rules: American English spelling (see
        `packages/blit386/.claude/rules/american-english-spelling.md`, including literal third-party / spec-mandated
        name exemptions); no emoji anywhere (`packages/blit386/CLAUDE.md` Critical Rule 1); published-doc TypeScript
        fences must use `ts twoslash` (see `packages/blit386/.claude/rules/twoslash-docs.md`); docs authoring style per
        `packages/blit386/.claude/rules/docs-authoring.md`. Ignore the generated `<!-- blit386.dev-banner:start -->` …
        `<!-- blit386.dev-banner:end -->` region (owned by `packages/blit386/scripts/sync-doc-banners.mjs`, never
        hand-edited).
    - path: 'packages/demos/src/**/*.js'
      instructions: >-
        Demo source files, written for readers with little or no coding experience. Comment nearly every line or logical
        block in plain English, explain programming concepts as they appear (what `Math.sin()` returns, what `%` does),
        and use analogies where they help. Never assume the reader knows what a function does just from its name; a
        comment that only restates the code without explaining it is a quality issue. Relaxed lint compared to the
        library: JSDoc is not required, console logging is allowed, and demo classes may freely mutate instance state in
        `update()`/`render()` for performance (the workspace immutability preference does not apply here). Integer
        coordinates only (`Vector2i`/`Rect2i`, never raw floats); match the `blit386` library's public `BT` API names
        (see `packages/blit386/CLAUDE.md`, Boolean naming / Input conventions); American English spelling (see
        `packages/demos/.claude/rules/american-english-spelling.md`, including literal third-party / spec-mandated name
        exemptions); no emoji anywhere. Filenames are number-free kebab-case with no numeric prefix; follow the standard
        section and lifecycle-method order in `packages/demos/.claude/rules/file-structure.md`. Canonical detail:
        `packages/demos/CLAUDE.md` ("Demo File Conventions", "Documentation Style", "Code Quality (Relaxed for Demos)").
    - path: 'packages/demos/docs/**/*.md'
      instructions: >-
        Contributor-facing docs (CI workspace setup, external developer setup, security headers) rather than published
        demo docs. American English spelling (see `packages/demos/.claude/rules/american-english-spelling.md`); no emoji
        anywhere. Keep instructions accurate to the current `pnpm run <script>` command set if referenced.
    - path: 'packages/demos/CLAUDE.md'
      instructions: >-
        Repo contributor guide: American English spelling; no emoji; keep commands as `pnpm run <script>` (not bare
        `pnpm <script>`). When demo conventions, workflow, or project structure change, keep the matching sections
        accurate (see `packages/demos/.claude/rules/docs-sync-required.md`).
    - path: 'packages/demos/README.md'
      instructions: >-
        Public demos README, including the `## Demos` list. American English; no emoji; beginner-friendly. New or
        renamed demos must use the number-free hosted URL (`https://demos.blit386.dev/<slug>`) and sit under the right
        category; keep in sync with `plugins/demo-order.js` (`DEMO_ORDER`).
    - path: 'packages/demos/.claude/skills/**/SKILL.md'
      instructions: >-
        Contributor skills for working on the demos package (`demos-*`). American English; no emoji; keep `pnpm run
        <script>` command forms accurate.
    - path: 'packages/docs-site/src/**/*.{ts,tsx}'
      instructions: >-
        Site TypeScript for the Fumapress/Waku docs site (React components, ServerPlugins, data loaders) – not the
        blit386 engine. Prefer `import type` for type-only imports; American English spelling (see
        `packages/docs-site/.claude/rules/american-english-spelling.md`, including literal third-party / spec-mandated
        name exemptions); no emoji anywhere. Lint/format with Biome (this package has no ESLint). Do not apply
        blit386-engine-only rules here (BTAPI access bans, Vector2i rendering coords, internal scoped naming) unless the
        change is documenting those APIs. Version-history UI (`Since`, `ApiAvailability`, `PageChangelog`) reads
        `src/data/api-history.ts` over generated JSON – never invent symbols in the generated file; fix the engine and
        re-sync. Canonical detail: `packages/docs-site/CLAUDE.md`.
    - path: 'packages/docs-site/scripts/**'
      instructions: >-
        Build/CI helpers (`sync-docs-from-engine.mjs`, `watch-engine-docs.mjs`, `patch-wrangler.mjs`,
        `patch-html-title.mjs`, `encode-video.mjs`) plus `scripts/__tests__`. The sync script is MDX-aware and owns the
        Documentation mirror – it must not gain a hard-coded per-page list (publish set lives in
        `packages/blit386/docs/_sitemap.json`). American English; no emoji; keep `pnpm run <script>` command forms
        accurate. Tests use `node --test` via `pnpm run test`.
    - path: 'packages/docs-site/{press.config.tsx,source.config.ts,waku.config.ts}'
      instructions: >-
        Site wiring: Fumapress plugins/layouts/`GLOBAL_HEAD` (`press.config.tsx`), fumadocs-mdx collections and Twoslash
        (`source.config.ts`), Waku/Vite plugins (`waku.config.ts`). MDX components used in engine docs must be
        registered in `fumadocsMdx({ getMdxComponents })`. Twoslash is gated on `CLOUDFLARE` (production builds only) –
        do not "fix" that by enabling it in dev. American English; no emoji. When plugins or routing change, check
        whether `CLAUDE.md` / `README.md` still match (see `packages/docs-site/.claude/rules/docs-sync-required.md`).
    - path: 'packages/docs-site/content/**'
      instructions: >-
        Hand-authored MDX and meta (landing, showcase, community, mcp-server, blog, and docs hub pages such as
        `content/docs/index.mdx`, `getting-started.mdx`, `faq.mdx`, plus root/docs `meta.json`). Generated engine-mirror
        pages under `content/docs/{api,guides,performance,reference}/` are path-filtered out – if they appear anyway, do
        not suggest hand-edits; point at `packages/blit386/docs/` + `pnpm run sync:docs`. Required frontmatter includes
        `title`; American English; no emoji. After link changes, `pnpm run docs:links`. Custom MDX components must be
        registered in `press.config.tsx`. Canonical detail: `packages/docs-site/CLAUDE.md` Content Conventions and
        `packages/docs-site/.claude/rules/fumapress-content.md`.
    - path: 'packages/docs-site/CLAUDE.md'
      instructions: >-
        Repo contributor guide: American English spelling; no emoji; keep commands as `pnpm run <script>` (not bare
        `pnpm <script>`). When site config, plugins, sync behavior, or deploy flow changes, keep the Architecture /
        Commands / Documentation mirror sections accurate (see
        `packages/docs-site/.claude/rules/docs-sync-required.md`).
    - path: 'packages/docs-site/README.md'
      instructions: >-
        Public docs-site README: American English; no emoji; beginner-friendly. Keep install/run/deploy examples
        accurate for this Fumapress site (not the engine or scaffolder).
    - path: 'packages/docs-site/public/**'
      instructions: >-
        Static assets served as-is: Cloudflare `_headers`, WebMCP bridge (`webmcp.js`), demo thumbnails, and
        `.well-known/` agent-discovery files. Keep security headers and discovery cards accurate; no emoji in
        user-facing strings.
    - path: 'packages/docs-site/.claude/skills/**/SKILL.md'
      instructions: >-
        Contributor skills for working on the docs site (`fp-*`). American English; no emoji; keep `pnpm run <script>`
        command forms accurate.
    - path: 'packages/{create-blit386,kit}/src/**/*.ts'
      instructions: >-
        This is TypeScript for the scaffolder CLI (`packages/create-blit386`) or the `blit` CLI / migrations
        (`packages/kit`), not engine or generated-game code. Follow create-blit386 house rules: named exports only (no
        default exports); prefer `import type` for type-only imports; American English spelling (see
        `packages/create-blit386-workspace/.claude/rules/american-english-spelling.md`, including literal third-party /
        spec-mandated name exemptions); no emoji anywhere. Lint/format with Biome (no ESLint here). Do not apply
        blit386-engine-only rules here (BTAPI access bans, Vector2i rendering coords, internal scoped naming) unless the
        change is documenting or scaffolding those APIs for games. Canonical detail:
        `packages/create-blit386-workspace/CLAUDE.md`.
    - path: 'packages/create-blit386/templates/**'
      instructions: >-
        Scaffold output for end-user games. Keep beginner-friendly comments (explain what and why). Integer coordinates
        via `Vector2i` / `Rect2i`; use the `BT` namespace, never `BTAPI`. Do NOT apply library-only TypeScript
        conventions (no `any` bans, named-export rules, etc.) to generated game files – JS is the default; the TS
        Catcher layer is intentionally approachable. Placeholders use `{{name}}` tokens; unknown tokens must stay
        visible if mis-typed. Kit `AGENTS.md` / `docs/` are copied verbatim elsewhere (no placeholder substitution) – do
        not introduce `{{gameFile}}` into those kit files from a template-only change. Canonical detail:
        `packages/create-blit386-workspace/.claude/rules/template-structure.md`.
    - path: 'packages/kit/content/**'
      instructions: >-
        Canonical kit IR shipped into every scaffolded game (`AGENTS.md`, `docs/`, `rules/`, `skills/`, hooks,
        `agents.config.json`). American English; no emoji; beginner-friendly prose. Self-contained: reference only
        `blit386` and other local kit files – never `blit386-demos` slugs or URLs. `AGENTS.md` and `docs/` are copied
        byte-for-byte (no `{{placeholder}}` substitution), so spell out both `src/game.js` and `src/game.ts`. Skills and
        rules are discovered by directory scan – adding a skill folder is enough (`agents.config.json` does not list
        skills by name). Keep public `BT` / `configure()` names aligned with the sibling blit386 engine. Canonical
        detail: `packages/create-blit386-workspace/CLAUDE.md` "Kit content vs engine docs" and
        `packages/create-blit386-workspace/.claude/rules/docs-sync-required.md`.
    - path: 'packages/create-blit386-workspace/CLAUDE.md'
      instructions: >-
        Repo contributor guide: American English spelling; no emoji; keep commands as `pnpm run <script>` (not bare
        `pnpm <script>`). When scaffold or kit behavior changes, check whether the kit-audit table and "Where to find"
        section still match (see `packages/create-blit386-workspace/.claude/rules/docs-sync-required.md`).
    - path: 'packages/{create-blit386,kit}/README.md'
      instructions: >-
        Package READMEs for create-blit386 / @blit386/kit: American English; no emoji; keep CLI command lists and skill
        tables aligned with shipped content.
    - path: 'packages/create-blit386-workspace/CREATE_BLIT386_DESIGN.md'
      instructions: >-
        Durable product decisions (not a release changelog). American English; no emoji. Prefer updating an existing
        section (for example Hot reload §12) over duplicating decisions elsewhere.
    - path: 'packages/create-blit386-workspace/.claude/skills/**/SKILL.md'
      instructions: >-
        Contributor skills for working on the scaffolder/kit monorepo (`cbt-*`). American English; no emoji; keep `pnpm
        run <script>` command forms accurate.
  auto_review:
    enabled: false
    labels: ['cr']
