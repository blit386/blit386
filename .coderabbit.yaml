# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration.
#
# Review exclusions (path_filters): generated or duplicated trees that add noise
# without unique review signal.
#
# - `docs/_api-history.json` is generated by `scripts/gen-api-history.mjs` and is
#   never hand-edited; diffs are mechanical version/symbol maps.
# - `tests/visual/__snapshots__/**` are binary PNG visual-regression baselines;
#   content is not useful for text review.
# - `.agents/skills/**` are relative symlinks into `.claude/skills/**`; reviewing
#   both duplicates identical content.
# - `pnpm-lock.yaml` is a generated lock file (listed explicitly even though it
#   may already match CodeRabbit defaults).
#
# Banner blocks inside published docs (`<!-- blit386.dev-banner:start -->` …
# `<!-- blit386.dev-banner:end -->`, owned by `scripts/sync-doc-banners.mjs`) are
# in-file regions, not whole files — excluded via path_instructions below, not
# path_filters.
#
# Auto review is disabled by default. To enable it, add the `cr` label to the PR.
reviews:
  review_status: false
  path_filters:
    - '!docs/_api-history.json'
    - '!tests/visual/__snapshots__/**'
    - '!.agents/skills/**'
    - '!pnpm-lock.yaml'
  path_instructions:
    - path: 'src/**/*.ts'
      instructions: >-
        Follow BLIT386 TypeScript house rules: no `any` (use `unknown` or proper types); type-only imports (`import
        type`); integer coordinates via `Vector2i`/`Rect2i` (never raw floats for rendering); named exports only; use
        the `BT` namespace and never access `BTAPI` from demo/game code; prefer BT getters for zero-arg read-only
        snapshots and methods for mutations / parameterized queries; keep private/protected/module-local names free of
        enclosing class/file repetition (internal scoped naming). Canonical detail: CLAUDE.md Critical Rules, and
        `.claude/rules/{bt-api-getters,internal-scoped-naming,ts-file-structure}.md`.
    - path: 'docs/**/*.md'
      instructions: >-
        Follow docs house rules: American English spelling (see `.claude/rules/american-english-spelling.md`, including
        literal third-party / spec-mandated name exemptions); no emoji anywhere (CLAUDE.md Critical Rule 1);
        published-doc TypeScript fences must use `ts twoslash` (see `.claude/rules/twoslash-docs.md`); docs authoring
        style per `.claude/rules/docs-authoring.md`. Ignore the generated `<!-- blit386.dev-banner:start -->` … `<!--
        blit386.dev-banner:end -->` region (owned by `scripts/sync-doc-banners.mjs`, never hand-edited).
  auto_review:
    enabled: false
    labels: ['cr']
