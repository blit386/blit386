packages:
  - 'packages/*'

trustPolicy: no-downgrade

# Packages published more than a year ago predate widespread npm provenance adoption
# and legitimately lack trust evidence newer releases of the same package now carry
# (e.g. chokidar@4.0.3, semver@6.3.1) - age itself is the trust signal for those. Real
# takeovers of actively-maintained packages show up as violations well inside a year.
trustPolicyIgnoreAfter: 525600

overrides:
  vite-node: ^5.2.0
  esbuild: ^0.28.2
  js-yaml@>=3.0.0 <3.15.1: ^3.15.2
  js-yaml@>=4.0.0 <4.3.1: ^4.3.2
  undici@>=7.0.0 <7.30.1: ^7.30.1
  # GHSA-2v37-7h3g-55p8 (high): custom generators loop indefinitely when size is zero.
  # Dev-only, reached through postcss via vite and vitest, so it never enters a runtime
  # bundle - but `security:audit` covers dev + prod, so it fails CI. 3.3.17 is the patch.
  nanoid@<3.3.17: ^3.3.20
  # GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf / GHSA-jqff-g426-hqxp
  # (all high): host confusion and SSRF via malformed IPv6/percent-decoding/scheme
  # normalization. Dev-only, reached through ajv via commitlint and
  # @microsoft/api-extractor (vite-plugin-dts), so it never enters a runtime bundle - but
  # `security:audit` covers dev + prod, so it fails CI. 3.1.9 is the patch; pinned to the
  # latest 3.x (3.1.9) rather than the 4.x major, since ajv declares `^3.0.1`.
  fast-uri@<3.1.9: ^3.1.9
  # Zod can exhaust memory while validating oversized input (high). 4.6.6 is the patch; the
  # override also lifts the transitive 4.1.8 copy.
  zod@<4.6.6: ^4.6.6
  # GHSA-gqvv-2mrq-wpjv (moderate): incomplete fix for CVE-2026-39408 - toSSG() still
  # writes files outside the output directory. GHSA-g6gw-c38x-mqfc (moderate): unbounded
  # dot-notation nesting in parseBody() can cause memory exhaustion. GHSA-crvj-82cr-hjcx
  # (moderate): query parser reads params after the URL fragment, causing cache-key and
  # proxy interpretation differentials. Build-tooling only, reached through fumadocs-core
  # and waku in packages/website's docs pipeline, so it never enters a runtime bundle -
  # but `security:audit` covers dev + prod, so it fails CI. 4.13.5 is the patch; pinned
  # to the latest 4.x (4.13.7) since waku@1.0.0-beta.6 declares hono@^4.12.14.
  hono@<4.13.5: ^4.13.14
  # GHSA-rmxm-3fg6-px4f (moderate): serveStatic decodes the request path a second time,
  # bypassing middleware on static paths. Build-tooling only, reached through waku in
  # packages/website's docs pipeline, so it never enters a runtime bundle - but
  # `security:audit` covers dev + prod, so it fails CI. 2.1.3 is the patch.
  '@hono/node-server@<2.1.3': ^2.1.5
  # GHSA-g3hv-75wg-m249 (moderate): minimatch denial of service via globparts amplification.
  # Dev-only, reached through eslint (@eslint/config-array), api-extractor, and
  # vite-plugin-dts (@vue/language-core), so it never enters a runtime bundle - but
  # `security:audit` covers dev + prod, so it fails CI. 11.0.1 is the only patch (no
  # backport), so this crosses the major each consumer declares.
  minimatch@<11.0.1: 11.0.1
  # GHSA-3g3m-2fjr-6pw4 (moderate): AbortSignal cancellation bypass allows post-timeout
  # filesystem traversal. Dev-only, reached through nyc, rimraf, and test-exclude
  # (coverage tooling in packages/blit386), so it never enters a runtime bundle - but
  # `security:audit` covers dev + prod, so it fails CI. 14.0.2 is the patch and the only
  # line that has it, so this crosses the major nyc declares.
  glob@>=9.0.0 <14.0.2: 14.0.2
  # GHSA-rgj7-g3m4-5g8c (GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545, high): libheif
  # vulnerabilities. Dev-only, reached through miniflare via wrangler
  # (packages/website devDependency) for OG image generation, so it never enters a
  # runtime bundle - but `security:audit` covers dev + prod, so it fails CI. No wrangler
  # release (checked up to the latest 5.x alpha pulled by wrangler@4.130.0) bundles a
  # patched miniflare - every version still pins sharp@0.35.2 - so this overrides the
  # transitive dependency directly. 0.35.4 is the patch for the libheif advisories, and
  # 0.35.5 for the librsvg one (GHSA-wq5f-xc86-pv6w, high), which also reaches
  # packages/website through fumapress.
  sharp@<0.35.5: ^0.35.5
  # GHSA-pqg4-j6r4-53mv (critical): quote() command injection via a line terminator in a
  # token after a { comment } token. Dev-only, reached through concurrently
  # (packages/demos), but `security:audit` covers dev + prod, so it fails CI. concurrently
  # still pins a vulnerable range, so this overrides the transitive dependency. 1.11.0 is
  # the patch.
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p / GHSA-q2hr-2g5m-vwhr (high/moderate):
  # brace-expansion denial of service via crafted patterns. Dev-only, reached through
  # minimatch via eslint, @typescript-eslint, and vite-plugin-dts (@vue/language-core), so
  # it never enters a runtime bundle - but `security:audit` covers dev + prod, so it fails
  # CI. One override per affected major so each consumer keeps the major its minimatch
  # declares: 2.1.7 and 5.0.12 are the patches.
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  # GHSA-rpw4-54j3-4h4q / GHSA-2vr4-cq9g-pvrc / GHSA-j6r3-76f7-8jcv / GHSA-h3mg-xc3c-68pw
  # (high/moderate): ip-address vulnerabilities. Dev-only, reached through socks via
  # proxy-agent, link-check, and markdown-link-check, so it never enters a runtime bundle -
  # but `security:audit` covers dev + prod, so it fails CI. 10.7.1 is the patch.
  ip-address@<=10.7.0: ^10.7.5
  # GHSA-c475-qrg2-pj4r (high): quadratic-time denial of service in basic-ftp's
  # Client.list() directory-listing parser. Dev-only, reached through get-uri via
  # pac-proxy-agent, proxy-agent, and markdown-link-check, so it never enters a runtime
  # bundle - but `security:audit` covers dev + prod, so it fails CI. 6.2.1 is the only
  # patch (no 5.x backport), so this crosses the major get-uri declares (`^5.0.2`); the
  # link checker never fetches ftp: URLs, so that code path is not exercised.
  basic-ftp@<=6.2.0: ^6.2.5
  # GHSA-r4xh-jqrq-34v2 (moderate): quadratic-time parse() from parseKey rescanning to the
  # end of the document on each key line. Dev-only, reached through cspell (cspell-config-lib)
  # and knip, so it never enters a runtime bundle - but `security:audit` covers dev + prod,
  # so it fails CI. 1.8.1 is the patch; 1.9.0 is the latest.
  smol-toml@<1.8.1: ^1.9.1
  # GHSA-rj75-hqrm-r3gf (moderate): quadratic complexity in flat selector parsing allows CPU
  # exhaustion. Dev-only, reached through postcss-nesting in packages/demos' CSS pipeline,
  # so it never enters a runtime bundle - but `security:audit` covers dev + prod, so it
  # fails CI. 7.1.6 is the patch.
  postcss-selector-parser@<7.1.6: ^7.1.7
  # GHSA-68fv-2mgg-jv7q (high): event-loop denial of service. Dev-only, reached through
  # vite, tailwindcss, @vue/compiler-core (vite-plugin-dts), and magicast
  # (@vitest/coverage-v8), so it never enters a runtime bundle - but `security:audit` covers
  # dev + prod, so it fails CI. 1.2.2 is the patch.
  source-map-js@<1.2.2: ^1.2.2
  # @opencode-ai/plugin is a type-only devDependency of packages/kit. It declares
  # effect@4.0.0-beta.83, which trustPolicy rejects, and the published root .d.ts
  # never imports effect. Drop that one edge instead of installing either pin.
  '@opencode-ai/plugin>effect': '-'

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

audit:
  ignore:
    - GHSA-gv7w-rqvm-qjhr
    # GHSA-hp3w-g68c-fv3c (moderate): sprintf-js denial of service. The advisory lists 1.1.4
    # as patched, but no such release exists on npm (latest is 1.1.3), so an override cannot
    # fix it. Dev-only, reached through argparse via js-yaml@3 (nyc, vite-plugin-istanbul)
    # and @microsoft/api-extractor, so it never enters a runtime bundle. Remove this entry
    # once sprintf-js publishes a patched release.
    - GHSA-hp3w-g68c-fv3c

# Supply-chain hardening for pnpm 11. pnpm 11 only reads auth/registry settings from
# .npmrc; everything else (this block, overrides, allowBuilds, audit above) must live
# here instead.
minimumReleaseAge: 10080
blockExoticSubdeps: true
strictDepBuilds: true
minimumReleaseAgeExclude:
  # Routine tool updates, not security patches: delete every entry on or after 2026-11-19.
  - '@biomejs/biome@2.6.7'
  - '@biomejs/cli-android-arm64@2.6.7'
  - '@biomejs/cli-android-x64@2.6.7'
  - '@biomejs/cli-darwin-arm64@2.6.7'
  - '@biomejs/cli-darwin-x64@2.6.7'
  - '@biomejs/cli-linux-arm64-musl@2.6.7'
  - '@biomejs/cli-linux-arm64@2.6.7'
  - '@biomejs/cli-linux-x64-musl@2.6.7'
  - '@biomejs/cli-linux-x64@2.6.7'
  - '@biomejs/cli-win32-arm64@2.6.7'
  - '@biomejs/cli-win32-x64@2.6.7'
  - '@cspell/cspell-bundled-dicts@10.4.1'
  - '@cspell/cspell-json-reporter@10.4.1'
  - '@cspell/cspell-performance-monitor@10.4.1'
  - '@cspell/cspell-pipe@10.4.1'
  - '@cspell/cspell-resolver@10.4.1'
  - '@cspell/cspell-service-bus@10.4.1'
  - '@cspell/cspell-types@10.4.1'
  - '@cspell/cspell-worker@10.4.1'
  - '@cspell/dynamic-import@10.4.1'
  - '@cspell/filetypes@10.4.1'
  - '@cspell/rpc@10.4.1'
  - '@cspell/strong-weak-map@10.4.1'
  - '@cspell/url@10.4.1'
  - cspell-config-lib@10.4.1
  - cspell-dictionary@10.4.1
  - cspell-gitignore@10.4.1
  - cspell-glob@10.4.1
  - cspell-grammar@10.4.1
  - cspell-io@10.4.1
  - cspell-lib@10.4.1
  - cspell-trie-lib@10.4.1
  - cspell@10.4.1
  - knip@6.45.1
  - prettier@3.10.1
  - unbash@6.0.4
