packages:
  - 'packages/*'

trustPolicy: no-downgrade

# Packages published more than a year ago predate widespread npm provenance adoption
# and legitimately lack trust evidence newer releases of the same package now carry
# (e.g. chokidar@4.0.3, semver@6.3.1) - age itself is the trust signal for those. Real
# takeovers of actively-maintained packages show up as violations well inside a year.
trustPolicyIgnoreAfter: 525600

overrides:
  esbuild: ^0.28.2
  undici@>=7.0.0 <7.30.1: ^7.30.1
  # Zod can exhaust memory while validating oversized input (high). 4.6.6 is the patch; the
  # override also lifts the transitive 4.1.8 copy.
  zod@<4.6.6: ^4.6.6
  # GHSA-g3hv-75wg-m249 (moderate): minimatch denial of service via globparts amplification.
  # Dev-only, reached through eslint (@eslint/config-array), api-extractor, and
  # vite-plugin-dts (@vue/language-core), so it never enters a runtime bundle - but
  # `security:audit` covers dev + prod, so it fails CI. 11.0.1 is the only patch (no
  # backport), so this crosses the major each consumer declares.
  minimatch@<11.0.1: 11.0.1
  # GHSA-3g3m-2fjr-6pw4 (moderate): AbortSignal cancellation bypass allows post-timeout
  # filesystem traversal. Dev-only, reached through nyc, rimraf, and test-exclude
  # (coverage tooling in packages/blit386), so it never enters a runtime bundle - but
  # `security:audit` covers dev + prod, so it fails CI. 14.0.2 is the patch and the only
  # line that has it, so this crosses the major nyc declares.
  glob@>=9.0.0 <14.0.2: 14.0.2
  # GHSA-c475-qrg2-pj4r (high): quadratic-time denial of service in basic-ftp's
  # Client.list() directory-listing parser. Dev-only, reached through get-uri via
  # pac-proxy-agent, proxy-agent, and markdown-link-check, so it never enters a runtime
  # bundle - but `security:audit` covers dev + prod, so it fails CI. 6.2.1 is the only
  # patch (no 5.x backport), so this crosses the major get-uri declares (`^5.0.2`); the
  # link checker never fetches ftp: URLs, so that code path is not exercised.
  basic-ftp@<=6.2.0: ^6.2.5
  # GHSA-qv5m-9pm6-hqp3 and GHSA-jpvv-r467-5p4w (moderate): path-separator parsing bypass and an
  # unhandled ECONNRESET during WebSocket upgrade in @hono/node-server. Reached only through waku
  # (packages/website, fumadocs), which the docs site build uses, but `security:audit` covers
  # dev + prod, so it fails CI. 2.1.6 is the patch.
  '@hono/node-server@>=2.0.0 <2.1.6': ^2.1.6
  # @opencode-ai/plugin is a type-only devDependency of packages/kit. It declares
  # effect@4.0.0-beta.83, which trustPolicy rejects, and the published root .d.ts
  # never imports effect. Drop that one edge instead of installing either pin.
  '@opencode-ai/plugin>effect': '-'

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Supply-chain hardening for pnpm 11. pnpm 11 only reads auth/registry settings from
# .npmrc; everything else (this block, overrides, allowBuilds, and `audit.ignore` if one is ever needed) must live
# here instead.
minimumReleaseAge: 10080
blockExoticSubdeps: true
strictDepBuilds: true
minimumReleaseAgeExclude:
  # Routine tool updates, not security patches: delete every entry on or after 2026-11-19.
  - '@biomejs/biome@2.6.7'
  - '@biomejs/cli-android-arm64@2.6.7'
  - '@biomejs/cli-android-x64@2.6.7'
  - '@biomejs/cli-darwin-arm64@2.6.7'
  - '@biomejs/cli-darwin-x64@2.6.7'
  - '@biomejs/cli-linux-arm64-musl@2.6.7'
  - '@biomejs/cli-linux-arm64@2.6.7'
  - '@biomejs/cli-linux-x64-musl@2.6.7'
  - '@biomejs/cli-linux-x64@2.6.7'
  - '@biomejs/cli-win32-arm64@2.6.7'
  - '@biomejs/cli-win32-x64@2.6.7'
  - '@cspell/cspell-bundled-dicts@10.4.1'
  - '@cspell/cspell-json-reporter@10.4.1'
  - '@cspell/cspell-performance-monitor@10.4.1'
  - '@cspell/cspell-pipe@10.4.1'
  - '@cspell/cspell-resolver@10.4.1'
  - '@cspell/cspell-service-bus@10.4.1'
  - '@cspell/cspell-types@10.4.1'
  - '@cspell/cspell-worker@10.4.1'
  - '@cspell/dynamic-import@10.4.1'
  - '@cspell/filetypes@10.4.1'
  - '@cspell/rpc@10.4.1'
  - '@cspell/strong-weak-map@10.4.1'
  - '@cspell/url@10.4.1'
  - cspell-config-lib@10.4.1
  - cspell-dictionary@10.4.1
  - cspell-gitignore@10.4.1
  - cspell-glob@10.4.1
  - cspell-grammar@10.4.1
  - cspell-io@10.4.1
  - cspell-lib@10.4.1
  - cspell-trie-lib@10.4.1
  - cspell@10.4.1
  - knip@6.45.1
  - prettier@3.10.1
  - unbash@6.0.4
