packages:
  - 'packages/*'

trustPolicy: no-downgrade

# Packages published more than a year ago predate widespread npm provenance adoption
# and legitimately lack trust evidence newer releases of the same package now carry
# (e.g. chokidar@4.0.3, semver@6.3.1) - age itself is the trust signal for those. Real
# takeovers of actively-maintained packages show up as violations well inside a year.
trustPolicyIgnoreAfter: 525600

overrides:
  vite-node: ^5.2.0
  esbuild: ^0.28.2
  js-yaml@>=3.0.0 <3.15.1: ^3.15.1
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  undici@>=7.0.0 <7.29.0: ^7.29.0
  # GHSA-2v37-7h3g-55p8 (high): custom generators loop indefinitely when size is zero.
  # Dev-only, reached through postcss via vite and vitest, so it never enters a runtime
  # bundle - but `security:audit` covers dev + prod, so it fails CI. 3.3.17 is the patch.
  nanoid@<3.3.17: ^3.3.18
  # GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf / GHSA-jqff-g426-hqxp
  # (all high): host confusion and SSRF via malformed IPv6/percent-decoding/scheme
  # normalization. Dev-only, reached through ajv via commitlint and
  # @microsoft/api-extractor (vite-plugin-dts), so it never enters a runtime bundle - but
  # `security:audit` covers dev + prod, so it fails CI. 3.1.6 is the patch; pinned to the
  # latest 3.x (3.1.7) rather than the 4.x major, since ajv declares `^3.0.1`.
  fast-uri@<3.1.6: ^3.1.7

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

audit:
  ignore:
    - GHSA-gv7w-rqvm-qjhr

# Supply-chain hardening for pnpm 11. pnpm 11 only reads auth/registry settings from
# .npmrc; everything else (this block, overrides, allowBuilds, audit above) must live
# here instead.
minimumReleaseAge: 10080
blockExoticSubdeps: true
strictDepBuilds: true

minimumReleaseAgeExclude:
  - ws
  - fast-uri
  - undici
  - '@types/node'
  - '@commitlint/cli'
  # Security patch for GHSA-2v37-7h3g-55p8, published 2026-08-03 and so still inside the
  # 7-day window. Pinned to the exact vetted version rather than a bare `nanoid`, which
  # would exempt every future release from the supply-chain gate permanently. Drop this
  # entry once the patch ages past the gate.
  - nanoid@3.3.18
  - '@commitlint/config-conventional'
  - cspell
  - knip
  - lint-staged
  - markdown-link-check
  - husky
  - eslint-plugin-jsdoc@63.3.3
  # CVE-2026-59870 (GHSA-5p4m-2wfm-xmqj) fix; 3.15.1/4.3.1 published 2026-07-31, inside
  # the 7-day gate at the time of the override.
  - js-yaml
  # Transitive dependencies of markdown-link-check; excluded because installs stalled on them.
  - chalk
  - link-check
  - markdown-link-extractor
  # packages/website: Fumapress/Waku/Fumadocs pull transitive deps (Takumi, Hono,
  # lucide-react) that publish more often than the 7-day gate tolerates. Extend this
  # list rather than weaken the window if installs stall on a new fast-moving dep.
  - waku
  - fumadocs
  - fumapress
  - takumi
  - hono
  - lucide-react
