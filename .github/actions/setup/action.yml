name: Setup workspace
description: pnpm, Node.js, and a frozen-lockfile install for the blit386 monorepo.

# Every CI job repeats these three steps, so they live here rather than a dozen times
# over. This is also the single place the toolchain pins are declared.
#
# Checkout is deliberately NOT here. A local composite action is resolved from the
# checked-out working tree, so a job must run actions/checkout before the runner can
# even find this file - putting checkout inside it cannot work. Jobs therefore check out
# first, which is also what lets the three jobs that need full history or tags pass
# their own fetch-depth / fetch-tags without this action having to proxy them.
#
# Not to be confused with the `workspace-setup` composite action this replaced, which
# cloned blit386/blit386 from GitHub, hand-wrote a two-package pnpm-workspace.yaml, and
# installed without a frozen lockfile. The monorepo has one lockfile, so every install
# here is frozen.

runs:
  using: composite

  steps:
    - name: Setup pnpm
      # No `version` input on purpose: pnpm/action-setup reads `packageManager` from the
      # root package.json, which is already the pinned source of truth. Declaring it here
      # too would be a second pin that has to be kept in step with the first.
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22.23.2'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
