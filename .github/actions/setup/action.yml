name: Setup workspace
description: Checkout, pnpm, Node.js, and a frozen-lockfile install for the blit386 monorepo.

# Every CI job starts the same four steps, so they live here rather than being repeated
# a dozen times. This is also the single place the toolchain and action pins are
# declared - bump them once, not once per job.
#
# Not to be confused with the `workspace-setup` composite action this replaced, which
# cloned blit386/blit386 from GitHub, hand-wrote a two-package pnpm-workspace.yaml, and
# installed without a frozen lockfile. The monorepo has one lockfile, so every install
# here is frozen.

inputs:
  fetch-depth:
    description: >-
      Number of commits to fetch. Use '0' for full history in any job whose steps run `git log --follow` -
      sync:docs:check and api:history:check both do, and both return nothing on a shallow clone.
    required: false
    default: '1'
  fetch-tags:
    description: >-
      Whether to fetch tags. api:history:check and test:api-history resolve release dates from them; without tags the
      dates go null and the committed manifest looks drifted.
    required: false
    default: 'false'

runs:
  using: composite

  steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: ${{ inputs.fetch-tags }}
        persist-credentials: false

    - name: Setup pnpm
      # No `version` input on purpose: pnpm/action-setup reads `packageManager` from the
      # root package.json, which is already the pinned source of truth. Declaring it here
      # too would be a second pin that has to be kept in step with the first.
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22.23.1'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
