name: Kit Docs Drift

# BT-293: advisory, non-blocking drift detection between the engine's public API
# (packages/blit386/docs/_api-history.json) and the kit's hand-written docs
# (packages/kit/content/docs/*.md). Never gates a PR - see the header comment in
# scripts/report-kit-docs-drift.mjs for why. Files/updates a tracking issue in Linear
# (team BT) instead of failing a status check.
#
# Requires LINEAR_API_KEY (a Linear Personal API key with issue read/write access on the
# workspace containing team BT), held as a secret of the `kit-docs-drift` Environment, whose
# deployment-branch rule allows `main` only. Not a repo or org secret: those are readable
# from any branch. Not set up by this workflow; until the Environment and secret exist, the
# report script detects the missing key and skips the Linear call cleanly (exit 0). Set the
# main-only rule BEFORE adding the secret: GitHub auto-creates an unknown Environment on the
# first run that names it, with no branch rule.

on:
  push:
    branches: [main]
    paths:
      - 'packages/blit386/docs/_api-history.json'
      - 'packages/kit/package.json'
  schedule:
    - cron: '0 9 * * 1' # weekly Monday backstop, catches drift a push trigger missed
  workflow_dispatch:

concurrency:
  # One fixed, workflow-wide group (not keyed by github.ref): a schedule run and a
  # workflow_dispatch run from a different branch must never execute concurrently, or
  # they could both detect the same drift and file duplicate Linear issues.
  group: kit-docs-drift
  cancel-in-progress: true

jobs:
  report-drift:
    name: Report kit docs drift
    runs-on: ubuntu-latest
    # Gate for LINEAR_API_KEY, see the CWE-200 note on the last step.
    environment: kit-docs-drift
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'

      # No pnpm install: check-kit-docs-drift.mjs, lib/linear-client.mjs, and
      # report-kit-docs-drift.mjs use only Node builtins (fs, fetch).
      #
      # LINEAR_API_KEY comes from the `kit-docs-drift` Environment, whose deployment-branch
      # rule allows `main` only (CWE-200). push/schedule are already main-only (see the `on:`
      # triggers above), but workflow_dispatch has no ref restriction and runs the dispatched
      # branch's own copy of this file, so a check written in the YAML could be edited away
      # by a branch. The Environment rule is enforced by GitHub, outside the file: a run on
      # any other ref is refused before the job starts and never receives the secret.
      - name: Check and report kit docs drift
        run: node scripts/report-kit-docs-drift.mjs
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
