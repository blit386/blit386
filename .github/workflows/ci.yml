name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22.18.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all dependencies (moderate+)
        run: pnpm run security:audit

      - name: Audit production dependencies (moderate+)
        run: pnpm run security:audit:prod

      - name: Security audit summary
        if: always()
        run: |
          {
            echo '## Dependency security audit'
            echo ''
            echo '| Check | Command |'
            echo '|-------|---------|'
            echo '| All dependencies | `pnpm run security:audit` |'
            echo '| Production only | `pnpm run security:audit:prod` |'
            echo ''
            echo "Policy: moderate and above fail CI. See docs/security/dependency-policy.md."
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if:
      github.event_name != 'pull_request' || !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
      (github.event.action == 'labeled' && contains(fromJSON('["perf"]'), github.event.label.name))
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22.18.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check
        background: true

      - name: Lint code
        run: pnpm run lint
        background: true

      - name: Type check
        run: pnpm run typecheck
        background: true

      - name: Spell check
        run: pnpm run spellcheck
        background: true

      - name: Check documentation links
        run: pnpm run docs:links
        background: true

      - name: Check agent config drift
        run: pnpm run agents:check
        background: true

      - name: Check doc site banners
        run: pnpm run sync:doc-banners:check
        background: true

      - name: Check cursor commands drift
        run: pnpm run sync:cursor-commands:check
        background: true

      - name: Check unused exports and dependencies
        run: pnpm run knip
        background: true

      - name: Check API @since tags
        run: pnpm run api:since:check
        background: true

      - name: Check API history manifest
        run: pnpm run api:history:check
        background: true

      - wait-all:

  build-library:
    name: Build Library
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request' || !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22.18.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build 2>&1 | tee build.log
        env:
          NODE_ENV: production

      - name: Verify declaration tooling alignment
        run: pnpm run build:check-declarations build.log

      - name: Upload library artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: library-dist
          path: dist/
          retention-days: 7

  bundle-size:
    name: Check Bundle Size
    runs-on: ubuntu-latest
    needs: build-library
    if: github.event_name != 'pull_request' || !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    permissions:
      contents: read

    steps:
      - name: Download library artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: library-dist
          path: dist

      - name: Check bundle size
        id: size
        run: |
          ESM_SIZE=$(stat -c%s dist/blit386.js 2>/dev/null || stat -f%z dist/blit386.js)
          CJS_SIZE=$(stat -c%s dist/blit386.cjs 2>/dev/null || stat -f%z dist/blit386.cjs)
          ESM_GZIP=$(gzip -c dist/blit386.js | wc -c | tr -d ' ')
          CJS_GZIP=$(gzip -c dist/blit386.cjs | wc -c | tr -d ' ')

          echo "esm_size=$ESM_SIZE" >> $GITHUB_OUTPUT
          echo "cjs_size=$CJS_SIZE" >> $GITHUB_OUTPUT
          echo "esm_gzip=$ESM_GZIP" >> $GITHUB_OUTPUT
          echo "cjs_gzip=$CJS_GZIP" >> $GITHUB_OUTPUT

          # Convert to KB for display
          ESM_KB=$(echo "scale=2; $ESM_SIZE / 1024" | bc)
          CJS_KB=$(echo "scale=2; $CJS_SIZE / 1024" | bc)
          ESM_GZIP_KB=$(echo "scale=2; $ESM_GZIP / 1024" | bc)
          CJS_GZIP_KB=$(echo "scale=2; $CJS_GZIP / 1024" | bc)

          echo "esm_kb=$ESM_KB" >> $GITHUB_OUTPUT
          echo "cjs_kb=$CJS_KB" >> $GITHUB_OUTPUT
          echo "esm_gzip_kb=$ESM_GZIP_KB" >> $GITHUB_OUTPUT
          echo "cjs_gzip_kb=$CJS_GZIP_KB" >> $GITHUB_OUTPUT

      - name: Bundle size report
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Format | Raw | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| ESM (.js) | ${{ steps.size.outputs.esm_kb }} KB | ${{ steps.size.outputs.esm_gzip_kb }} KB |" >> $GITHUB_STEP_SUMMARY
          echo "| CJS (.cjs) | ${{ steps.size.outputs.cjs_kb }} KB | ${{ steps.size.outputs.cjs_gzip_kb }} KB |" >> $GITHUB_STEP_SUMMARY

      - name: Check size limits
        run: |
          # Fail if gzipped ESM exceeds 70 KB (adjust as needed)
          ESM_GZIP=${{ steps.size.outputs.esm_gzip }}
          MAX_SIZE=71680  # 70 KB in bytes

          if [ "$ESM_GZIP" -gt "$MAX_SIZE" ]; then
            echo "::error::Bundle size (${{ steps.size.outputs.esm_gzip_kb }} KB gzipped) exceeds limit (70 KB)"
            exit 1
          fi

          echo "Bundle size is within limits"

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'perf')
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-benchmark
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22.18.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        run: pnpm run bench:json

      - name: Upload current benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results-current
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload main benchmark baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-baseline
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 90

      - name: Find latest main benchmark baseline
        id: find-baseline
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const workflowId = 'ci.yml';
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: 'main',
              event: 'push',
              status: 'completed',
              per_page: 100,
            });

            for (const run of runs) {
              if (run.conclusion !== 'success') {
                continue;
              }

              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const baselineArtifact = artifacts.find(
                (artifact) => artifact.name === 'benchmark-baseline' && artifact.expired === false,
              );

              if (!baselineArtifact) {
                continue;
              }

              core.setOutput('found', 'true');
              core.setOutput('download-url', baselineArtifact.archive_download_url);
              core.setOutput('artifact-id', String(baselineArtifact.id));
              core.setOutput('run-id', String(run.id));
              return;
            }

            core.setOutput('found', 'false');

      - name: Download main benchmark baseline
        if: github.event_name == 'pull_request' && steps.find-baseline.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASELINE_URL: ${{ steps.find-baseline.outputs.download-url }}
        run: |
          mkdir -p baseline-artifact
          curl --fail --location \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${BASELINE_URL}" \
            --output baseline-artifact.zip
          unzip -o baseline-artifact.zip -d baseline-artifact

      - name: Compare benchmark results
        if: github.event_name == 'pull_request'
        run: >
          node scripts/compare-tier-1-benchmarks.mjs --current benchmark-results.json --baseline
          baseline-artifact/benchmark-results.json --json-out benchmark-comparison.json --markdown-out
          benchmark-comment.md --threshold 25

      - name: Upload benchmark comparison artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-comparison
          path: |
            benchmark-comparison.json
            benchmark-comment.md
            benchmark-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Post benchmark PR comment
        if:
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor !=
          'dependabot[bot]'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BENCHMARK_COMMENT_PATH: benchmark-comment.md
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- benchmark-comparison -->';
            const body = fs.readFileSync(process.env.BENCHMARK_COMMENT_PATH, 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existingComment = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on benchmark regressions
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          if (!fs.existsSync('benchmark-comparison.json')) {
              process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync('benchmark-comparison.json', 'utf8'));

          if (!report.hasBaseline) {
              process.exit(0);
          }

          const hasFailures = report.summary.regressions > 0 || report.summary.missingBenchmarks > 0;

          if (hasFailures) {
              process.exit(1);
          }
          EOF

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request' || !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22.18.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm run test:unit:coverage

      - name: Run API history generator tests
        run: pnpm run test:api-history

      - name: Run security preflight tests
        run: pnpm run test:security-preflight

      - name: Upload coverage
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        if: always()
        with:
          files: ./coverage/coverage-final.json
