name: Deploy

# BT-406: production deploys are tag-triggered (a release tag such as `1.5.0`, no `v` prefix,
# no prerelease suffix), plus workflow_dispatch for a manual redeploy without cutting a tag.
# main still deploys continuously, but to the next.* preview targets below - never to
# production. That is the fix for the original problem this phase exists to solve: before
# this, both sites deployed from every push to main, so demos and docs describing unreleased
# engine features went live before the release that documents them.
#
# No path filter on the next.* jobs, on purpose - matches deploy-demos/deploy-website's
# existing no-filter design. A wrong filter here means a preview site silently stays stale
# rather than failing loudly, and the whole point of a preview channel is that it never lags
# main. Both the website and demos depend on the workspace engine (packages/blit386), so a
# path filter would also have to track that cross-package edge correctly, which a push-to-
# main preview channel should not have to get right to do its job.
#
# Each job builds its own site rather than downloading ci.yml's artifacts, same as before -
# a tag-triggered job cannot reuse artifacts from a push-triggered ci.yml run anyway.

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  # Never run two deploys of the same site at once, and never cancel one in flight -
  # a half-finished deploy is worse than a queued one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-demos:
    name: Deploy Demos to Cloudflare Pages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      # demos consumes the engine as workspace:*, so the engine build is a prerequisite.
      - name: Build engine (workspace dependency)
        run: pnpm --filter blit386 run build

      - name: Build demos
        run: pnpm --filter blit386-demos run build
        env:
          NODE_ENV: production

      # workingDirectory is what keeps the relative `dist/` in `command` correct from the
      # monorepo root. wranglerVersion and packageManager are pinned the same way on all
      # four wrangler-action steps in this file (BT-441) - see deploy-website below for why
      # the version is pinned at all.
      #
      # `--branch=main` is load-bearing, not cosmetic. Without it wrangler infers the branch
      # from git, and this job's only real trigger is a release tag push, which checks out a
      # detached HEAD. The inferred branch is then `head`, which is not the project's
      # production branch, so Pages files the upload as a *preview* deployment and
      # demos.blit386.dev keeps serving the previous build. The job still reports success,
      # because uploading is what succeeded. That is exactly what happened on the 1.5.0 tag
      # (deployment alias `head.blit-tech-demos.pages.dev`); production stayed stale until a
      # workflow_dispatch on main, where the inferred branch happened to be right.
      #
      # deploy-demos-next below does not need this: it only runs on push to main, so the
      # inferred branch is already that project's production branch.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/demos
          command: pages deploy dist/ --project-name=blit386-demos --branch=main
          wranglerVersion: '4.114.0'
          packageManager: pnpm

  deploy-website:
    name: Deploy Website to Cloudflare Workers
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      # website consumes the engine as workspace:*, so the engine build is a
      # prerequisite. `build` sets CLOUDFLARE=1 (Twoslash) and its postbuild lifecycle
      # patches dist/server/wrangler.json, which is the config deployed below.
      - name: Build engine (workspace dependency)
        run: pnpm --filter blit386 run build

      - name: Build site
        run: pnpm --filter blit386-website run build
        env:
          NODE_ENV: production

      # wranglerVersion is pinned rather than left to wrangler-action's default so this
      # deploy always runs the same wrangler as local `pnpm run deploy` / `pnpm run start`
      # (packages/website/package.json's wrangler devDependency, not wrangler-action's own
      # default) - a Renovate bump to that devDependency and this pin must move together,
      # or the two silently drift. All four wrangler-action steps in this file share the
      # same pin and packageManager for the same reason, even where (deploy-demos*) neither
      # setting is strictly required by the job itself.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/website
          command: deploy --config dist/server/wrangler.json --name blit386
          wranglerVersion: '4.114.0'
          packageManager: pnpm

  deploy-demos-next:
    name: Deploy Demos to Cloudflare Pages (next preview)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      # demos consumes the engine as workspace:*, so the engine build is a prerequisite.
      - name: Build engine (workspace dependency)
        run: pnpm --filter blit386 run build

      - name: Build demos (next channel)
        run: pnpm --filter blit386-demos run build
        env:
          NODE_ENV: production
          BLIT386_CHANNEL: next

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/demos
          command: pages deploy dist/ --project-name=blit386-demos-next
          wranglerVersion: '4.114.0'
          packageManager: pnpm

  deploy-website-next:
    name: Deploy Website to Cloudflare Workers (next preview)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup

      # website consumes the engine as workspace:*, so the engine build is a
      # prerequisite.
      - name: Build engine (workspace dependency)
        run: pnpm --filter blit386 run build

      - name: Build site (next channel)
        run: pnpm --filter blit386-website run build
        env:
          NODE_ENV: production
          BLIT386_CHANNEL: next

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/website
          command: deploy --config dist/server/wrangler.json --name blit386-next
          wranglerVersion: '4.114.0'
          packageManager: pnpm
