name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Build and format check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.node-version'

      # Corepack reads the `packageManager` field in package.json, so the runner gets the exact npm, pnpm, or yarn
      # that scaffolded this game - no second version pin to keep in step. Bun is not managed by Corepack, so a Bun
      # project installs it globally here instead.
      - name: Set up package manager
        run: '{{pmCiPrepare}}'

      - name: Install dependencies
        run: '{{pmCiInstall}}'

      - name: Check formatting
        run: '{{pmRunFormat}}:check'

      - name: Build
        run: '{{pmRunBuild}}'
