<!doctype html>

<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{{title}}</title>
    <link rel="stylesheet" href="../styles/layout.css"/>
    <link rel="stylesheet" href="../styles/twoslash-rich.css"/>
    <link rel="stylesheet" href="../styles/demo-source.css"/>
    <script>
        // Stamp shell vs embed on <html> before the first paint so layout.css sizing
        // (banner height, iframe vs canvas) is correct on the first frame.
        (function () {
            var embedded = new URLSearchParams(location.search).has('embed');

            // Shell keeps the :root --banner-height from layout.css; embed overrides to 0.
            if (embedded) {
                document.documentElement.style.setProperty('--banner-height', '0px');
                document.documentElement.setAttribute('data-embed', 'true');
            } else {
                document.documentElement.setAttribute('data-shell', 'true');
            }

            window.__blit386IsEmbedded = embedded;
        })();
    </script>
</head>

<body data-slug="{{slug}}">

<script id="demo-list" type="application/json">{{demoList}}</script>

<!--
  Shell mode (default): persistent banner + content iframe. Demo swaps change the iframe
  src and history.pushState the clean demo URL; the banner never reloads.

  Embed mode (?embed): #canvas-container + #demo-source only (no banner). Used by the
  shell iframe and by external embeds on blit386.dev.

  Both regions are in the markup; the inline script below removes the inactive one
  before the engine or analytics run (static hosts serve one HTML for both URLs).
-->
<nav id="demo-banner" aria-label="Demo navigation"></nav>

<iframe id="demo-frame" title="Demo content"></iframe>

<div id="canvas-container">
    <canvas id="blit386-canvas"></canvas>
</div>

<section id="demo-source" aria-label="Demo source">
    <div class="demo-source-code">
        {{sourceHtml}}
    </div>
</section>

<script>
    (function () {
        /**
         * Parse the demo list serialized into the page by the build (see plugins/virtual-demos.js).
         * Already filtered to nav-visible demos, in canonical order.
         * @returns {Array<{slug: string, navLabel: string, title: string}>}
         */
        function readDemoList() {
            return JSON.parse(document.getElementById('demo-list').textContent);
        }

        /**
         * Index of the current page's demo within `demos`, or -1 if this demo is nav-hidden
         * (e.g. barebones, excluded from the dropdown/prev-next chain).
         * @param {Array<{slug: string}>} demos
         * @returns {number}
         */
        function findCurrentIndex(demos) {
            var currentSlug = document.body.dataset.slug;

            return demos.findIndex(function (demo) {
                return demo.slug === currentSlug;
            });
        }

        // Matches plugins/demo-registry.js's FILENAME_PATTERN (minus the .js extension).
        // Every slug that reaches urlFor() is validated against this allowlist before it is
        // used to build a navigation target, so a corrupted or tampered demo-list payload
        // (or select value) can never produce anything but a same-directory path -- never a
        // "javascript:" or other unexpected URL scheme.
        var SLUG_PATTERN = /^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$/;

        /**
         * Build a same-directory link to another demo page. The directory is derived from
         * the current page's own pathname, so this resolves correctly under both dev
         * (/demos/<slug>.html) and the flattened production build (/<slug>.html).
         * @param {string} slug - Demo slug, e.g. "basics"
         * @returns {string}
         */
        function urlFor(slug) {
            if (!SLUG_PATTERN.test(slug)) {
                throw new Error('Refusing to navigate to invalid demo slug: ' + slug);
            }

            var dir = location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1);

            return dir + slug + '.html';
        }

        /**
         * Embed-mode URL for a demo (same path as urlFor, with ?embed). Loaded inside the
         * shell iframe so the blit386 engine can be torn down by discarding the frame.
         * @param {string} slug
         * @returns {string}
         */
        function embedUrlFor(slug) {
            return urlFor(slug) + '?embed';
        }

        /**
         * Read the demo slug from the current location pathname
         * (/demos/basics.html, /basics.html, or extensionless /basics).
         * @returns {string}
         */
        function slugFromLocation() {
            var name = location.pathname.slice(location.pathname.lastIndexOf('/') + 1);

            return name.replace(/\.html$/, '');
        }

        /**
         * Title-case a kebab-case slug, e.g. "sprite-effects" -> "Sprite Effects".
         * Mirrors plugins/demo-registry.js's titleCaseTopic for nav-hidden fallbacks.
         * @param {string} slug
         * @returns {string}
         */
        function titleCaseSlug(slug) {
            return slug
                .split('-')
                .map(function (word) {
                    return word.length > 0 ? word[0].toUpperCase() + word.slice(1) : word;
                })
                .join(' ');
        }

        /**
         * Look up the document title for a slug from the nav list. Nav-hidden slugs
         * (absent from `demos`) get a stable slug-derived title so popstate does not
         * leave a stale document.title from the previous demo.
         * @param {Array<{slug: string, title: string}>} demos
         * @param {string} slug
         * @returns {string}
         */
        function titleFor(demos, slug) {
            for (var i = 0; i < demos.length; i++) {
                if (demos[i].slug === slug) {
                    return demos[i].title;
                }
            }

            return 'BLIT386 Demo - ' + titleCaseSlug(slug);
        }

        /**
         * Build the light/dark BLIT386 logo link. Both images are always in the DOM;
         * CSS toggles which one is visible via `prefers-color-scheme`.
         * @returns {HTMLAnchorElement}
         */
        function buildLogo() {
            var logoLink = document.createElement('a');

            logoLink.className = 'demo-banner-logo';
            logoLink.href = 'https://blit386.dev';
            logoLink.setAttribute('aria-label', 'BLIT386');

            var logoLight = document.createElement('img');

            logoLight.className = 'demo-banner-logo-light';
            logoLight.src = '/sprites/favicon-light-32.png';
            logoLight.width = 64;
            logoLight.height = 64;
            logoLight.alt = 'BLIT386';

            logoLink.appendChild(logoLight);

            var logoDark = document.createElement('img');

            logoDark.className = 'demo-banner-logo-dark';
            logoDark.src = '/sprites/favicon-dark-32.png';
            logoDark.width = 64;
            logoDark.height = 64;
            logoDark.alt = 'BLIT386';

            logoLink.appendChild(logoDark);

            return logoLink;
        }

        /**
         * Enable or disable the prev/next buttons for the given index into `demos`.
         * @param {number} currentIndex
         * @param {number} demoCount
         * @returns {void}
         */
        function syncArrowDisabled(currentIndex, demoCount) {
            var prevButton = document.getElementById('demo-banner-prev');
            var nextButton = document.getElementById('demo-banner-next');

            if (!prevButton || !nextButton) {
                return;
            }

            prevButton.disabled = currentIndex <= 0;
            nextButton.disabled = currentIndex === -1 || currentIndex >= demoCount - 1;
        }

        /**
         * Keep the dropdown and arrow enabled-state aligned with `slug`.
         * @param {Array<{slug: string}>} demos
         * @param {string} slug
         * @returns {void}
         */
        function syncNavUI(demos, slug) {
            var select = document.getElementById('demo-banner-select');
            var currentIndex = demos.findIndex(function (demo) {
                return demo.slug === slug;
            });

            if (select) {
                if (currentIndex >= 0) {
                    select.value = slug;
                } else {
                    // Nav-hidden demos are not in the list; leave the control unselected.
                    select.selectedIndex = -1;
                }
            }

            syncArrowDisabled(currentIndex, demos.length);
        }

        /**
         * Swap the iframe to `slug`, update the shell title / body dataset, and optionally
         * push a clean top-level URL into the address bar (no full navigation -- the shell
         * stays loaded so the banner never reloads).
         * @param {string} slug
         * @param {{ pushState?: boolean, demos?: Array<{slug: string, title: string}> }} [options]
         * @returns {void}
         */
        function selectDemo(slug, options) {
            options = options || {};
            var demos = options.demos || readDemoList();
            var frame = document.getElementById('demo-frame');
            var embedUrl = embedUrlFor(slug);

            if (!frame) {
                return;
            }

            // Replace the iframe's history entry so back/forward stays on the shell
            // document; fall back to src assignment when the frame window is unavailable.
            try {
                if (frame.contentWindow && frame.contentWindow.location) {
                    frame.contentWindow.location.replace(embedUrl);
                } else {
                    frame.src = embedUrl;
                }
            } catch {
                frame.src = embedUrl;
            }

            document.body.dataset.slug = slug;
            document.title = titleFor(demos, slug);
            syncNavUI(demos, slug);

            if (options.pushState !== false) {
                history.pushState({ slug: slug }, '', urlFor(slug));
            }
        }

        /**
         * Build the "previous demo" arrow button.
         * @param {Array<{slug: string}>} demos
         * @returns {HTMLButtonElement}
         */
        function buildPrevButton(demos) {
            var prevButton = document.createElement('button');

            prevButton.type = 'button';
            prevButton.id = 'demo-banner-prev';
            prevButton.setAttribute('aria-label', 'Previous demo');
            prevButton.textContent = '‹';

            prevButton.addEventListener('click', function () {
                var currentIndex = findCurrentIndex(demos);

                if (currentIndex > 0) {
                    selectDemo(demos[currentIndex - 1].slug, { demos: demos });
                }
            });

            return prevButton;
        }

        /**
         * Build the "next demo" arrow button.
         * @param {Array<{slug: string}>} demos
         * @returns {HTMLButtonElement}
         */
        function buildNextButton(demos) {
            var nextButton = document.createElement('button');

            nextButton.type = 'button';
            nextButton.id = 'demo-banner-next';
            nextButton.setAttribute('aria-label', 'Next demo');
            nextButton.textContent = '›';

            nextButton.addEventListener('click', function () {
                var currentIndex = findCurrentIndex(demos);

                if (currentIndex >= 0 && currentIndex < demos.length - 1) {
                    selectDemo(demos[currentIndex + 1].slug, { demos: demos });
                }
            });

            return nextButton;
        }

        /**
         * Build the demo-jump dropdown, pre-selected to the current demo (left unselected
         * when the current demo is nav-hidden and so isn't in `demos` at all).
         * @param {Array<{slug: string, navLabel: string}>} demos
         * @param {number} currentIndex
         * @returns {HTMLSelectElement}
         */
        function buildSelect(demos, currentIndex) {
            var select = document.createElement('select');

            select.id = 'demo-banner-select';
            select.setAttribute('aria-label', 'Jump to demo');

            demos.forEach(function (demo, index) {
                var option = document.createElement('option');

                option.value = demo.slug;
                option.textContent = demo.navLabel;

                if (index === currentIndex) {
                    option.selected = true;
                }

                select.appendChild(option);
            });

            select.addEventListener('change', function (event) {
                selectDemo(event.target.value, { demos: demos });
            });

            return select;
        }

        /**
         * Build the prev/select/next navigation group.
         * @param {Array<{slug: string, navLabel: string}>} demos
         * @param {number} currentIndex
         * @returns {HTMLDivElement}
         */
        function buildNav(demos, currentIndex) {
            var nav = document.createElement('div');

            nav.className = 'demo-banner-nav';
            nav.appendChild(buildPrevButton(demos));
            nav.appendChild(buildSelect(demos, currentIndex));
            nav.appendChild(buildNextButton(demos));

            return nav;
        }

        /**
         * Populate the (initially empty) #demo-banner with the logo and nav group, point
         * the content iframe at this demo's embed URL, and wire back/forward navigation.
         * @returns {void}
         */
        function renderShell() {
            var demos = readDemoList();
            var currentIndex = findCurrentIndex(demos);
            var banner = document.getElementById('demo-banner');
            var frame = document.getElementById('demo-frame');
            var initialSlug = document.body.dataset.slug;

            banner.appendChild(buildLogo());
            banner.appendChild(buildNav(demos, currentIndex));
            syncArrowDisabled(currentIndex, demos.length);

            // Initial iframe src: this demo in embed mode (dev: /demos/<slug>.html?embed,
            // prod: /<slug>.html?embed). Same relative-path derivation as urlFor().
            frame.src = embedUrlFor(initialSlug);

            window.addEventListener('popstate', function () {
                var slug = slugFromLocation();

                if (!SLUG_PATTERN.test(slug)) {
                    return;
                }

                selectDemo(slug, { pushState: false, demos: demos });
            });
        }

        /**
         * Embed mode: drop the shell chrome so only the canvas + source panel remain.
         * @returns {void}
         */
        function prepareEmbed() {
            var banner = document.getElementById('demo-banner');
            var frame = document.getElementById('demo-frame');

            if (banner) {
                banner.remove();
            }

            if (frame) {
                frame.remove();
            }
        }

        /**
         * Shell mode: drop the in-page canvas / source hosts. The live demo runs inside
         * #demo-frame instead (workaround for the engine having no teardown API).
         * @returns {void}
         */
        function prepareShell() {
            var canvas = document.getElementById('canvas-container');
            var source = document.getElementById('demo-source');

            if (canvas) {
                canvas.remove();
            }

            if (source) {
                source.remove();
            }
        }

        if (window.__blit386IsEmbedded) {
            prepareEmbed();
        } else {
            prepareShell();
            renderShell();
        }
    })();
</script>

<script>
    // Analytics only on the shell document: skip both the loader download and init
    // inside embed iframes so demo swaps do not double-count.
    if (!window.__blit386IsEmbedded) {
        var plausibleScript = document.createElement('script');

        plausibleScript.async = true;
        plausibleScript.src = 'https://plausible.io/js/pa-Jy-1Ffqwh5Zpp2YOMEBr5.js';
        document.head.appendChild(plausibleScript);

        window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
        plausible.init()
    }
</script>

<script type="module">
    // Demo module only in embed mode. Shell mode hosts the demo inside #demo-frame so
    // swapping demos discards the old engine instance with the frame.
    // `scriptFile` is a root-absolute `/src/<slug>` path so Vite can resolve this import
    // from the HTML proxy module in dev (relative `../src/...` fails there).
    if (window.__blit386IsEmbedded) {
        await import('{{scriptFile}}.js');
    }
</script>
{{sourcePanelScript}}

</body>

</html>
