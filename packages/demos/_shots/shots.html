<!doctype html>

<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

    <title>BLIT386 Demo Shots</title>

    <meta name="robots" content="noindex"/>

    <link rel="stylesheet" href="../styles/layout.css"/>
    <link rel="stylesheet" href="../_shots/shots.css"/>
</head>

<body data-demo-base="{{demoBase}}" data-page-suffix="{{pageSuffix}}"
      data-engine-version="{{engineVersion}}">

<script id="demo-list" type="application/json">{{demoList}}</script>

<header id="demo-banner">
    <!-- Manual-sync hazard: the same logo as sheet.html and buildLogo() in _partials/demo-shell-banner.js. Change all together. -->
    <a class="demo-banner-logo" href="/shots" aria-label="BLIT386 Demos">
        <img class="demo-banner-logo-light" src="/sprites/favicon-light-32.png" width="64" height="64" alt="BLIT386"/>
        <img class="demo-banner-logo-dark" src="/sprites/favicon-dark-32.png" width="64" height="64" alt="BLIT386"/>
    </a>

    <div class="demo-banner-nav shots-banner-title">
        <h1><a href="https://blit386.dev">BLIT386</a> demo shots</h1>

        <p id="shots-status" aria-live="polite"></p>
    </div>

    <div class="shots-banner-tools">
        <div class="demo-banner-combobox shots-banner-filter">
            <input id="shots-filter" class="demo-banner-combobox-input" type="text" placeholder="Filter demos (/)"
                   aria-label="Filter demos" autocomplete="off" spellcheck="false"/>
        </div>

        <button id="shots-help" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
    </div>
</header>

<section id="shots-capture" hidden aria-label="Capture controls"></section>

<main id="shots-gallery" tabindex="0" aria-label="Captured frames"></main>

<aside id="shots-info" hidden aria-label="Tile details"></aside>

<div id="shots-lightbox" hidden role="dialog" aria-modal="true" aria-label="Zoomed capture"></div>

<div id="shots-help-overlay" hidden role="dialog" aria-label="Keyboard shortcuts"></div>

<iframe id="shots-frame" title="Capture frame" aria-hidden="true" tabindex="-1"></iframe>

<script type="module">
    await import('/_shots/shots.js');
</script>

</body>

</html>
