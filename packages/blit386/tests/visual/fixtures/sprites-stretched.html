<!doctype html>

<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Visual Test: Sprite Scale and Stretch</title>
        <style>
            body {
                margin: 0;
                background: black;
            }

            canvas {
                image-rendering: pixelated;
            }
        </style>
    </head>

    <body>
        <div id="canvas-container">
            <canvas height="240" id="blit386-canvas" width="320"></canvas>
        </div>

        <script type="module">
            import { bootstrap, BT, Color32, Palette, Rect2i, SpriteSheet, Vector2i } from 'blit386';

            // Signal test readiness regardless of success/failure.
            window.__RENDER_COMPLETE__ = false;
            window.__INIT_FAILED__ = false;

            const colorBlack = 1;

            // Six distinct cell colors, laid out as the doc's 3x2 `ABC / DEF` source.
            const CELL_COLORS = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];

            // Each cell is 6x6 pixels, so the 3x2-cell sprite is 18x12 - non-square and asymmetric.
            const CELL = 6;
            const SPRITE_W = 3 * CELL;
            const SPRITE_H = 2 * CELL;

            // A one-pixel black notch in cell A's top-left corner marks the source origin, so a flip
            // that only swaps cells of matching color would still show.
            function createSpriteImage() {
                const c = document.createElement('canvas');

                c.width = SPRITE_W;
                c.height = SPRITE_H;

                const ctx = c.getContext('2d');

                CELL_COLORS.forEach((color, i) => {
                    ctx.fillStyle = color;
                    ctx.fillRect((i % 3) * CELL, Math.floor(i / 3) * CELL, CELL, CELL);
                });

                ctx.clearRect(0, 0, 1, 1);

                const img = new Image();

                return new Promise((resolve) => {
                    img.onload = () => resolve(img);
                    img.src = c.toDataURL();
                });
            }

            class SpritesStretchedTest {
                spriteSheet = null;

                // Allocated once and rewritten per draw, as the docs recommend.
                params = { flags: 0, scale: 1, paletteOffset: 0 };

                configure() {
                    return {
                        // See sprites.html: no blit386() Vite plugin here, so disable the splash.
                        isSplashEnabled: false,
                        displaySize: new Vector2i(320, 240),
                        targetFPS: 60,
                    };
                }

                async init() {
                    const palette = new Palette(16);

                    palette.set(colorBlack, new Color32(0, 0, 0, 255));
                    CELL_COLORS.forEach((hex, i) => palette.set(2 + i, Color32.fromHex(hex)));

                    BT.paletteSet(palette);

                    const img = await createSpriteImage();

                    this.spriteSheet = new SpriteSheet(img);
                    this.spriteSheet.indexize(palette);

                    return true;
                }

                update() {}

                render() {
                    BT.clear(colorBlack);

                    const sheet = this.spriteSheet;

                    if (!sheet) {
                        return;
                    }

                    const src = new Rect2i(0, 0, SPRITE_W, SPRITE_H);
                    const params = this.params;

                    // Row 1: integer scales 1-4 (block copy). 18x12 grows to 72x48.
                    [1, 2, 3, 4].forEach((s, i) => {
                        params.scale = s;
                        BT.drawSprite(sheet, src, new Vector2i([8, 32, 76, 138][i], 8), params);
                    });

                    // Row 2: non-uniform scale in screen axes, combined with flags.
                    params.flags = BT.ROT_90_CW;
                    params.scale = new Vector2i(3, 1); // 12x18 footprint -> 36x18
                    BT.drawSprite(sheet, src, new Vector2i(8, 64), params);
                    params.flags = BT.FLIP_H;
                    params.scale = new Vector2i(1, 2); // 18x24
                    BT.drawSprite(sheet, src, new Vector2i(52, 64), params);

                    // Row 3: uneven Rect2i stretches (center sampling decides every column and row).
                    params.scale = 1;
                    params.flags = 0;
                    const stretches = [
                        [new Rect2i(8, 100, 12, 8), 0], // 3:2 down
                        [new Rect2i(28, 100, 9, 6), 0], // 2:1 down
                        [new Rect2i(45, 100, 27, 18), 0], // 2:3 up
                        [new Rect2i(80, 100, 25, 17), 0], // odd up
                        [new Rect2i(112, 100, 31, 7), BT.FLIP_V], // wide and short, flipped
                        [new Rect2i(150, 100, 13, 29), BT.ROT_90_CW], // turned, odd sizes
                        [new Rect2i(170, 100, 7, 23), BT.ROT_270_CW | BT.FLIP_H],
                        [new Rect2i(185, 100, 1, 1), 0], // single pixel
                    ];

                    stretches.forEach(([rect, flags]) => {
                        params.flags = flags;
                        BT.drawSprite(sheet, src, rect, params);
                    });

                    // Row 4: paletteOffset through a Rect2i stretch, and a fractional-looking ratio on both axes.
                    params.flags = 0;
                    params.paletteOffset = 1;
                    BT.drawSprite(sheet, src, new Rect2i(8, 140, 41, 23), params);
                    params.paletteOffset = 0;

                    // Signal render complete.
                    window.__RENDER_COMPLETE__ = true;
                }
            }

            bootstrap(SpritesStretchedTest, {
                onError: () => {
                    window.__INIT_FAILED__ = true;
                },
            });
        </script>
    </body>
</html>
